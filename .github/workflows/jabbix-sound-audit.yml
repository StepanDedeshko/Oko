name: Jabbix sound audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Collect sound and notification references
        run: |
          {
            echo '=== filenames ==='
            find app tests -type f -name '*.py' -print | sort
            echo '=== sound/audio/multimedia references ==='
            grep -RInE 'QSoundEffect|QMediaPlayer|QAudioOutput|MULTIMEDIA|sound|audio|звук|Звук|beep|notify|notification' app tests || true
            echo '=== update notification references ==='
            grep -RInE 'Обновление найдено|update found|check_for_updates|update_available|latest_version' app tests main.py || true
            echo '=== graph completion references ==='
            grep -RInE 'график|graph.*(done|finish|complete)|провер.*заверш|проверено|notification' app tests || true
          } > jabbix-sound-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jabbix-sound-audit
          path: jabbix-sound-audit.txt
          retention-days: 1
