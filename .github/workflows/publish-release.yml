name: Publish Oko 0.3.7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Release Oko 0.3.7')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build lean runtime archives
        run: python build_release.py

      - name: Verify release archives
        run: |
          python -m py_compile main.py app/main_window.py build_release.py
          unzip -t dist/update.zip
          unzip -t dist/Oko-0.3.7-linux.zip
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.7
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/update.zip \
              dist/Oko-0.3.7-linux.zip \
              dist/SHA256SUMS.txt \
              --clobber
            gh release edit "$TAG" \
              --title "Око 0.3.7" \
              --notes-file RELEASE_NOTES_0.3.7.md \
              --latest
          else
            gh release create "$TAG" \
              dist/update.zip \
              dist/Oko-0.3.7-linux.zip \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Око 0.3.7" \
              --notes-file RELEASE_NOTES_0.3.7.md \
              --latest
          fi
