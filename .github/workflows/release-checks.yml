name: Release checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            xvfb \
            libegl1 libgl1 libgbm1 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 \
            libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n INSTALL_OKO.sh
          bash -n INSTALL_OKO_GUI.sh
          bash -n install_gui.sh
          bash -n UPDATE_OKO.sh
          bash -n CHECK_RELEASE.sh
          bash -n IMPORT_JABBIX_RELEASE_ASSETS.sh

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Run full test suite
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: |
          set +e
          xvfb-run -a env PYTHONPATH=. python -m pytest -q --junitxml=pytest-junit.xml >pytest.log 2>&1
          status=$?
          printf '%s\n' "$status" > pytest.exitcode
          tail -n 180 pytest.log
          exit "$status"

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest.log
            pytest-junit.xml
            pytest.exitcode
          if-no-files-found: warn
          retention-days: 7

  required-jabka-assets:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact Jabbix release assets
        run: |
          set -Eeuo pipefail
          manifest="JABBIX_ASSET_SHA256SUMS_0.3.7.txt"
          if [[ ! -f "$manifest" ]]; then
            echo "Missing Jabbix checksum manifest: $manifest" >&2
            exit 1
          fi
          sha256sum -c "$manifest"

          python - <<'PY'
          import wave
          from pathlib import Path
          from PIL import Image

          pngs = (
              Path("assets/themes/jabka/backgrounds/00_main_menu_wallpaper.png"),
              Path("assets/themes/jabka/backgrounds/10_settings_menu_wallpaper.png"),
          )
          for path in pngs:
              with Image.open(path) as image:
                  assert image.format == "PNG", f"{path}: expected PNG"
                  assert image.size == (1672, 941), f"{path}: unexpected size {image.size}"

          wavs = (
              Path("assets/themes/jabka/sounds/frog_croak.wav"),
              Path("app/assets/sounds/jabbix_graph_check_kvak.wav"),
              Path("app/assets/sounds/jabbix_update_found_kvak.wav"),
          )
          for path in wavs:
              with wave.open(str(path), "rb") as audio:
                  assert audio.getnchannels() == 1, f"{path}: expected mono"
                  assert audio.getsampwidth() == 2, f"{path}: expected 16-bit PCM"
                  assert audio.getframerate() == 44100, f"{path}: expected 44100 Hz"
          PY
